services:
  postgres:
    image: postgres:16-alpine
    container_name: vacuum-postgres
    environment:
      POSTGRES_USER: vacuum
      POSTGRES_PASSWORD: vacuum
      POSTGRES_DB: vacuum
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vacuum -d vacuum"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vacuum-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STORAGE: postgres
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: vacuum
      PGPASSWORD: vacuum
      PGDATABASE: vacuum
      PORT: 3000
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres-data:
