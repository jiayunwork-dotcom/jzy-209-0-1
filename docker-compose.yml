services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vacuum
      POSTGRES_PASSWORD: vacuum
      POSTGRES_DB: vacuum
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vacuum -d vacuum"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://vacuum:vacuum@db:5432/vacuum
      PORT: "3000"
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
